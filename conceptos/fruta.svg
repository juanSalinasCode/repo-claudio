<path d="M245 250 Q215 470 270 640 Q400 700 530 640 Q585 470 555 250 Z" fill="url(#fruit)"/>
<path d="M245 250 Q215 470 270 640 Q400 700 530 640 Q585 470 555 250 Z" fill="url(#layers)"/>
