<path d="M290 540 c 30 -30 70 0 40 25 c -20 16 -40 -6 -22 -16"/>
<path d="M420 570 c 30 -30 70 0 40 25 c -20 16 -40 -6 -22 -16"/>
</g>
<!-- rim with glass insert -->
<ellipse cx="400" cy="250" rx="155" ry="26" fill="#5e2a80" stroke="#2c0f40" stroke-width="3"/>
<ellipse cx="400" cy="250" rx="125" ry="19" fill="#d8eef4" stroke="#9bbac4" stroke-width="3"/>
<ellipse cx="400" cy="252" rx="110" ry="13" fill="#b07a3c" opacity=".7"/>
<!-- leaves on top -->
<path d="M300 236 q-40 -60 20 -80 q10 50 -20 80z" fill="#3d9a4a" stroke="#1a5522" stroke-width="3"/>
<path d="M330 232 q20 -70 70 -60 q-25 45 -70 60z" fill="#4fb35a" stroke="#1a5522" stroke-width="3"/>
