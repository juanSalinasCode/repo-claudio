<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs>
<radialGradient id="bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#fbf6ff"/><stop offset="1" stop-color="#ddd0ea"/></radialGradient>
<radialGradient id="fruit" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#c98be8"/><stop offset=".55" stop-color="#7b3aa8"/><stop offset="1" stop-color="#3d1658"/></radialGradient>
<linearGradient id="stem" x1="0" x2="1"><stop offset="0" stop-color="#1f6b2a"/><stop offset=".5" stop-color="#4fb35a"/><stop offset="1" stop-color="#1a5522"/></linearGradient>
<pattern id="layers" width="8" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="3.5" x2="8" y2="3.5" stroke="#000" stroke-opacity=".07"/></pattern>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<ellipse cx="400" cy="690" rx="210" ry="26" fill="#000" opacity=".15"/>
